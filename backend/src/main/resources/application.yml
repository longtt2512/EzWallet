# ============================================================================
# EzWallet - Cấu hình base dùng chung cho mọi profile
# Profile cụ thể (dev/test/prod) sẽ override các giá trị ở đây.
# ============================================================================

spring:
  application:
    name: ezwallet
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /api/v1
  compression:
    enabled: true

# ----- Cấu hình JWT (đọc từ biến môi trường, có giá trị mặc định cho dev) -----
ezwallet:
  security:
    jwt:
      secret: ${JWT_SECRET:ezwallet-super-secret-key-change-me-in-production-please-make-it-long-enough-for-hs256}
      access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 phút
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 ngày
      issuer: ezwallet
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:8080
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket-public: ezwallet-public
    bucket-private: ezwallet-private

# ----- OpenAPI / Swagger -----
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

# ----- Actuator -----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
